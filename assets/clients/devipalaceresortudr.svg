<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="60%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#ca8a04"/>
          </linearGradient>
          <linearGradient id="dpBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#241b05"/>
            <stop offset="100%" stop-color="#040301"/>
          </linearGradient>
          <filter id="palaceGlow">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#dpBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#dpGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Palace Archway Dome -->
        <path d="M100,46 C92,58 74,68 74,88 L74,120 L126,120 L126,88 C126,68 108,58 100,46 Z" fill="none" stroke="url(#dpGrad)" stroke-width="4" filter="url(#palaceGlow)"/>
        <path d="M88,120 L88,96 C88,90 100,84 100,84 C100,84 112,90 112,96 L112,120 Z" fill="url(#dpGrad)" opacity="0.8"/>
        <text x="100" y="148" font-family="'Cinzel', serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">DEVI PALACE</text>
        <text x="100" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="4">RESORT</text>
      </svg>