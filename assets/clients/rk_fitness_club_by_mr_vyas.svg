<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="vyasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdba74"/>
            <stop offset="50%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#c2410c"/>
          </linearGradient>
          <linearGradient id="vyasBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#261003"/>
            <stop offset="100%" stop-color="#050201"/>
          </linearGradient>
          <filter id="orangeGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#vyasBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#vyasGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Shield & Flame Athlete -->
        <path d="M100,50 L134,66 L134,102 C134,122 100,136 100,136 C100,136 66,122 66,102 L66,66 Z" fill="none" stroke="url(#vyasGrad)" stroke-width="4" filter="url(#orangeGlow)"/>
        <text x="100" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="url(#vyasGrad)" text-anchor="middle">MV</text>
        <text x="100" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MR. VYAS</text>
        <text x="100" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#fed7aa" text-anchor="middle" letter-spacing="3">COACHING</text>
      </svg>