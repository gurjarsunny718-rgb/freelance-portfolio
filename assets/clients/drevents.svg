<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="drGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
          </linearGradient>
          <linearGradient id="drBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#241407"/>
            <stop offset="100%" stop-color="#050201"/>
          </linearGradient>
          <filter id="goldGlow">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#drBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#drGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Royal Crown & DR Monogram -->
        <path d="M75,65 L85,82 L100,55 L115,82 L125,65 L122,90 L78,90 Z" fill="url(#drGrad)" filter="url(#goldGlow)"/>
        <text x="100" y="132" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="900" fill="url(#drGrad)" text-anchor="middle" letter-spacing="4">D R</text>
        <text x="100" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="5">EVENTS</text>
      </svg>