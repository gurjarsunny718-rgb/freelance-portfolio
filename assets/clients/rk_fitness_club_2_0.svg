<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fca5a5"/>
            <stop offset="50%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#b91c1c"/>
          </linearGradient>
          <linearGradient id="rkBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b0808"/>
            <stop offset="100%" stop-color="#080101"/>
          </linearGradient>
          <filter id="redGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#rkBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#rkGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Dumbbell Icon -->
        <rect x="52" y="76" width="12" height="34" rx="4" fill="url(#rkGrad)"/>
        <rect x="68" y="70" width="10" height="46" rx="4" fill="url(#rkGrad)"/>
        <rect x="78" y="88" width="44" height="10" fill="url(#rkGrad)" filter="url(#redGlow)"/>
        <rect x="122" y="70" width="10" height="46" rx="4" fill="url(#rkGrad)"/>
        <rect x="136" y="76" width="12" height="34" rx="4" fill="url(#rkGrad)"/>
        <text x="100" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">RK FITNESS</text>
        <text x="100" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="4">CLUB 2.0</text>
      </svg>