<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#86efac"/>
            <stop offset="50%" stop-color="#22c55e"/>
            <stop offset="100%" stop-color="#15803d"/>
          </linearGradient>
          <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#05210e"/>
            <stop offset="100%" stop-color="#010803"/>
          </linearGradient>
          <filter id="greenGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#aiBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#aiGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Target Arrow / Compass Bullseye -->
        <circle cx="100" cy="80" r="26" stroke="url(#aiGrad)" stroke-width="4" fill="none"/>
        <circle cx="100" cy="80" r="14" stroke="url(#aiGrad)" stroke-width="3" fill="none"/>
        <circle cx="100" cy="80" r="4" fill="url(#aiGrad)" filter="url(#greenGlow)"/>
        <path d="M120,60 L140,40" stroke="url(#aiGrad)" stroke-width="4" stroke-linecap="round"/>
        <text x="100" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AIMERS</text>
        <text x="100" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle" letter-spacing="4">INSTITUTE</text>
      </svg>