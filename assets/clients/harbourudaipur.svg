<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f472b6"/>
            <stop offset="50%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
          <linearGradient id="hbBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#240718"/>
            <stop offset="100%" stop-color="#050104"/>
          </linearGradient>
          <filter id="pinkGlow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="100" fill="url(#hbBg)"/>
        <circle cx="100" cy="100" r="94" stroke="url(#hbGrad)" stroke-width="4" fill="none" opacity="0.85"/>
        <!-- Anchor / Cocktail Crest -->
        <circle cx="100" cy="62" r="10" stroke="url(#hbGrad)" stroke-width="4" fill="none"/>
        <line x1="100" y1="72" x2="100" y2="114" stroke="url(#hbGrad)" stroke-width="5" stroke-linecap="round"/>
        <line x1="82" y1="84" x2="118" y2="84" stroke="url(#hbGrad)" stroke-width="5" stroke-linecap="round"/>
        <path d="M68,98 C68,126 132,126 132,98" fill="none" stroke="url(#hbGrad)" stroke-width="5" stroke-linecap="round" filter="url(#pinkGlow)"/>
        <text x="100" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HARBOUR</text>
        <text x="100" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#fbcfe8" text-anchor="middle" letter-spacing="4">UDAIPUR</text>
      </svg>